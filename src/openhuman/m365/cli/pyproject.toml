[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.scripts]
m365-cli = "m365_cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.setuptools]
py-modules = ["m365_cli"]
